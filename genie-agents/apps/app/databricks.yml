bundle:
  name: radar-tributario

variables:
  sql_warehouse_id:
    description: SQL Warehouse ID
  genie_space_id:
    description: Genie Space ID
  genie_space_name:
    description: Genie Space display name
    default: Radar Tributario
  catalog_name:
    description: Catálogo compartido utilizado en las notebooks
  participant_id:
    description: Identificador usado para crear los schemas del participante
  app_name:
    description: Nombre de la App (2-30 caracteres, único en el workspace)

resources:
  apps:
    radar_tributario:
      name: ${var.app_name}
      description: Triage de señales de riesgo tributario con Genie y write-back
      source_code_path: ./
      user_api_scopes:
        - dashboards.genie
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE
        - name: genie-space
          genie_space:
            name: ${var.genie_space_name}
            space_id: ${var.genie_space_id}
            permission: CAN_RUN
        - name: risk-queue
          uc_securable:
            securable_full_name: ${var.catalog_name}.gold_${var.participant_id}.risk_queue
            securable_type: TABLE
            permission: SELECT
        - name: tax-risk-metrics
          uc_securable:
            securable_full_name: ${var.catalog_name}.gold_${var.participant_id}.tax_risk_metrics
            securable_type: TABLE
            permission: SELECT
        - name: actions-table-read
          uc_securable:
            securable_full_name: ${var.catalog_name}.ops_${var.participant_id}.action_tasks
            securable_type: TABLE
            permission: SELECT
        - name: actions-table-write
          uc_securable:
            securable_full_name: ${var.catalog_name}.ops_${var.participant_id}.action_tasks
            securable_type: TABLE
            permission: MODIFY

targets:
  dev:
    default: true
    mode: development
    workspace:
      host: https://REPLACE_WITH_WORKSPACE_HOST
    variables:
      sql_warehouse_id: REPLACE_WITH_WAREHOUSE_ID
      genie_space_id: REPLACE_WITH_GENIE_SPACE_ID
      catalog_name: REPLACE_WITH_CATALOG_NAME
      participant_id: REPLACE_WITH_PARTICIPANT_ID
      app_name: radar-eq01
